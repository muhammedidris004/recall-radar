<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recall Radar</title>
<style>
  :root {
    --bg: #f6f4ee; --surface: #ffffff; --ink: #1a1917; --muted: #66615a; --line: #e4dfd3; --soft: #faf8f3;
    --danger: #b3261e; --danger-bg: #fdeceb;
    --warn: #8a5300; --warn-bg: #fff3d9;
    --info: #1a56c4; --info-bg: #eaf1ff;
    --neutral: #46423b; --neutral-bg: #eeebe3;
    --ok: #176b3a; --ok-bg: #e7f5ec;
    --radius: 20px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12110f; --surface: #1c1a17; --ink: #f3efe7; --muted: #a8a196; --line: #34312b; --soft: #211f1b;
      --danger: #ff9b8f; --danger-bg: #3b1e1b; --warn: #f5b95a; --warn-bg: #3a2a0e;
      --info: #8db4ff; --info-bg: #172540; --neutral: #d9d4c9; --neutral-bg: #2a2722; --ok: #74d69f; --ok-bg: #14301f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12110f; --surface: #1c1a17; --ink: #f3efe7; --muted: #a8a196; --line: #34312b; --soft: #211f1b;
    --danger: #ff9b8f; --danger-bg: #3b1e1b; --warn: #f5b95a; --warn-bg: #3a2a0e;
    --info: #8db4ff; --info-bg: #172540; --neutral: #d9d4c9; --neutral-bg: #2a2722; --ok: #74d69f; --ok-bg: #14301f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 17.5px/1.42 -apple-system, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif; padding: 18px 24px 12px; -webkit-font-smoothing: antialiased; }
  .grid { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 0.92fr); gap: 14px; max-width: 1240px; margin: 0 auto; align-items: start; }
  .col { display: grid; gap: 14px; min-width: 0; }
  @media (max-width: 880px) { body { padding: 14px; font-size: 17px; } .grid { grid-template-columns: 1fr; } }

  /* hero */
  .hero { border-radius: var(--radius); padding: 18px 24px; display: grid; grid-template-columns: 64px 1fr; gap: 18px; align-items: center; animation: rise .35s ease both; }
  .hero .badge { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; }
  .hero .badge svg { width: 38px; height: 38px; }
  .hero h1 { margin: 0; font-size: clamp(26px, 3.6vw, 38px); line-height: 1.08; letter-spacing: -0.02em; font-weight: 700; }
  .hero p { margin: 4px 0 0; font-size: 18px; line-height: 1.35; opacity: .92; }
  .t-danger { background: var(--danger-bg); color: var(--danger); } .t-danger .badge { background: var(--danger); color: var(--danger-bg); }
  .t-warn { background: var(--warn-bg); color: var(--warn); } .t-warn .badge { background: var(--warn); color: var(--warn-bg); }
  .t-info { background: var(--info-bg); color: var(--info); } .t-info .badge { background: var(--info); color: var(--info-bg); }
  .t-neutral { background: var(--neutral-bg); color: var(--neutral); } .t-neutral .badge { background: var(--neutral); color: var(--neutral-bg); }
  .t-ok { background: var(--ok-bg); color: var(--ok); } .t-ok .badge { background: var(--ok); color: var(--ok-bg); }
  .hero p { color: var(--ink); }

  /* cards */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 20px; animation: rise .35s ease both; }
  .card + .card { margin-top: 0; }
  .eyebrow { font-size: 12.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  h2 { margin: 0 0 4px; font-size: 21px; line-height: 1.25; letter-spacing: -0.01em; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; color: var(--muted); font-size: 14.5px; margin-bottom: 14px; }
  .pill { border: 1px solid var(--line); border-radius: 999px; padding: 2px 11px; font-size: 13.5px; color: var(--muted); background: var(--soft); white-space: nowrap; }

  /* criteria */
  .crit { display: grid; gap: 0; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 38px minmax(96px, 128px) 1fr 1fr; gap: 12px; padding: 10px 14px; align-items: center; border-top: 1px solid var(--line); animation: rise .4s ease both; }
  .row:first-child { border-top: 0; }
  .row .ic { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; }
  .row .ic svg { width: 18px; height: 18px; }
  .row .k { font-weight: 650; font-size: 16px; }
  .row .v { font-size: 16.5px; min-width: 0; overflow-wrap: anywhere; }
  .row .v small { display: block; font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 1px; }
  .row .v.none { color: var(--muted); font-style: italic; }
  .s-match .ic { background: var(--ok-bg); color: var(--ok); }
  .s-mismatch { background: var(--danger-bg); } .s-mismatch .ic { background: var(--danger); color: var(--danger-bg); }
  .s-close { background: var(--warn-bg); } .s-close .ic { background: var(--warn); color: var(--warn-bg); }
  .s-unknown .ic { background: var(--neutral-bg); color: var(--neutral); }
  .s-unknown .yours { color: var(--muted); }
  @media (max-width: 880px) { .row { grid-template-columns: 34px 1fr; } .row .v { grid-column: 2; } }

  .need { background: var(--warn-bg); color: var(--ink); border-radius: 14px; padding: 14px 16px; margin-top: 14px; display: grid; gap: 4px; }
  .need b { color: var(--warn); }
  .why { margin: 12px 2px 0; color: var(--muted); font-size: 15px; }

  /* remedy / hazard */
  .hazard { font-size: 17.5px; }
  .c3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .c2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .fix { background: var(--ok-bg); border-radius: 14px; padding: 14px 18px; display: grid; gap: 8px; }
  .fix .eyebrow { color: var(--ok); margin: 0; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { background: var(--ok); color: var(--ok-bg); border-radius: 999px; padding: 3px 13px; font-weight: 650; font-size: 15px; }
  .fix .txt { font-size: 17px; }
  .fix .contact { color: var(--muted); font-size: 15.5px; }
  .clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  button.link { all: unset; cursor: pointer; color: var(--info); font-weight: 600; font-size: 15px; }
  button.link:focus-visible { outline: 3px solid var(--info); outline-offset: 2px; border-radius: 4px; }

  /* photos */
  .photos { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x proximity; }
  figure { margin: 0; flex: 0 0 auto; width: 230px; scroll-snap-align: start; }
  figure a { display: block; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--neutral-bg); }
  figure img { display: block; width: 230px; height: 130px; object-fit: cover; }
  figcaption { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.3; }

  /* actions */
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  a.btn, button.btn { font: inherit; font-weight: 650; font-size: 16px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); padding: 0 16px; min-height: 52px; white-space: nowrap; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
  a.btn.primary, button.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  a.btn:hover, button.btn:hover { border-color: var(--ink); }
  a.btn:focus-visible, button.btn:focus-visible { outline: 3px solid var(--info); outline-offset: 3px; }
  button.btn[disabled] { opacity: .6; cursor: default; }

  /* label read */
  .read { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .read .pill b { color: var(--ink); font-weight: 650; }
  .read.strip { padding: 0 4px; }
  .read .pill.miss { border-style: dashed; }

  /* more */
  details.more { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
  details.more > summary { cursor: pointer; padding: 14px 18px; font-weight: 650; color: var(--muted); list-style: none; display: flex; align-items: center; gap: 8px; min-height: 52px; }
  details.more > summary::-webkit-details-marker { display: none; }
  details.more > summary::before { content: "▸"; transition: transform .15s; }
  details.more[open] > summary::before { transform: rotate(90deg); }
  details.more .inner { padding: 0 18px 18px; display: grid; gap: 16px; }
  .mini { border-top: 1px solid var(--line); padding-top: 14px; }
  .mini:first-child { border-top: 0; padding-top: 0; }

  .foot { color: var(--muted); font-size: 13.5px; line-height: 1.4; display: grid; gap: 6px; padding: 2px 4px; grid-column: 1 / -1; max-width: 1240px; margin: 4px auto 0; }

  /* case timeline */
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin: 6px 0 4px; }
  .step { position: relative; text-align: center; padding-top: 46px; font-size: 14.5px; color: var(--muted); font-weight: 600; }
  .step::before { content: ""; position: absolute; top: 15px; left: 0; right: 0; height: 4px; background: var(--line); }
  .step:first-child::before { left: 50%; } .step:last-child::before { right: 50%; }
  .step i { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 34px; height: 34px; border-radius: 50%; background: var(--surface); border: 3px solid var(--line); display: grid; place-items: center; z-index: 1; font-style: normal; }
  .step.done::before { background: var(--ok); } .step.done i { background: var(--ok); border-color: var(--ok); color: var(--ok-bg); }
  .step.done { color: var(--ink); }
  .step.now i { border-color: var(--ink); box-shadow: 0 0 0 5px color-mix(in srgb, var(--ink) 14%, transparent); }
  .step.now { color: var(--ink); }
  .step i svg { width: 16px; height: 16px; }
  .nextstep { display: grid; gap: 4px; }
  .nextstep .big { font-size: 21px; font-weight: 650; line-height: 1.3; }
  ul.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  ul.plain li::before { content: "•"; color: var(--muted); margin-right: 8px; }

  .skel { display: grid; gap: 16px; max-width: 1240px; margin: 0 auto; }
  .skel div { border-radius: var(--radius); background: linear-gradient(90deg, var(--neutral-bg), var(--soft), var(--neutral-bg)); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
  .empty { color: var(--muted); text-align: center; padding: 60px 10px; font-size: 20px; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes shimmer { to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="root"><div class="empty">Waiting for a recall check…</div></div>
<script>
(() => {
  const root = document.getElementById("root");
  const $ = (t, a = {}, ...kids) => {
    const e = document.createElement(t);
    for (const [k, v] of Object.entries(a)) {
      if (k === "class") e.className = v; else if (k === "onclick") e.onclick = v; else if (k === "html") e.innerHTML = v; else if (v != null && v !== false) e.setAttribute(k, v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) e.append(kid.nodeType ? kid : document.createTextNode(kid));
    return e;
  };

  // ---- inline icons (static, trusted) ----
  const ICON = {
    alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2.5 20h19L12 3z"/><path d="M12 10v4.5M12 17.6v.1"/></svg>',
    question: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 9.2a3 3 0 1 1 4.6 2.5c-1 .6-1.6 1.2-1.6 2.3"/><path d="M12 17.6v.1"/></svg>',
    eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    dash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 12h12"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
    near: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 9h12M6 15h12"/></svg>',
    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg>',
    ask: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 7v6M12 17v.1"/></svg>',
  };
  const icon = (n) => $("span", { html: ICON[n] });

  // ---- MCP Apps host bridge (JSON-RPC over postMessage) ----
  let nextId = 1; const pending = new Map();
  const send = (msg) => parent.postMessage({ jsonrpc: "2.0", ...msg }, "*");
  const request = (method, params) => new Promise((res, rej) => {
    const id = nextId++; pending.set(id, { res, rej }); send({ id, method, params });
    setTimeout(() => { if (pending.delete(id)) rej(new Error("host did not answer " + method)); }, 4000);
  });
  window.addEventListener("message", (ev) => {
    const m = ev.data; if (!m || m.jsonrpc !== "2.0") return;
    if (m.id != null && pending.has(m.id) && (m.result !== undefined || m.error)) {
      const p = pending.get(m.id); pending.delete(m.id); m.error ? p.rej(new Error(m.error.message)) : p.res(m.result); return;
    }
    if (m.method === "ui/notifications/tool-input") skeleton();
    if (m.method === "ui/notifications/tool-result") render(m.params?.structuredContent ?? null);
    if (m.method === "ui/notifications/host-context-changed" && m.params?.theme) document.documentElement.dataset.theme = m.params.theme;
  });
  request("ui/initialize", { protocolVersion: "2026-01-26", appInfo: { name: "recall-radar-result", version: "0.2.0" }, appCapabilities: {} })
    .then((r) => { if (r?.hostContext?.theme) document.documentElement.dataset.theme = r.hostContext.theme; send({ method: "ui/notifications/initialized", params: {} }); }).catch(() => {});
  const reportSize = () => send({ method: "ui/notifications/size-changed", params: { width: document.documentElement.scrollWidth, height: document.documentElement.scrollHeight } });
  new ResizeObserver(reportSize).observe(document.body);
  const callTool = (name, args) => request("tools/call", { name, arguments: args });
  const openLink = (url) => request("ui/open-link", { url }).catch(() => window.open(url, "_blank", "noopener"));

  // ---- helpers ----
  const fmtDate = (iso) => iso ? new Date(iso + "T00:00:00").toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" }) : "";
  const STATE_ICON = { match: "check", mismatch: "x", close: "near", unknown: "ask" };
  const link = (url, kids, cls = "btn") => $("a", { class: cls, href: url, onclick: (e) => { e.preventDefault(); openLink(url); } }, kids);

  function skeleton() {
    root.replaceChildren($("div", { class: "skel" }, $("div", { style: "height:120px" }), $("div", { style: "height:260px" })));
  }

  const HERO = {
    CONFIRMED: ["t-danger", "alert", "This is recalled", "Stop and follow the official fix."],
    NEEDS_INFO: ["t-warn", "question", "One more detail needed", "Check the label to be sure."],
    COMPARE_APPEARANCE: ["t-info", "eye", "Compare it by eye", "The notice names no model or date."],
    NO_MATCH: ["t-neutral", "dash", "No matching recall found", "That's not a safety guarantee. See coverage below."],
    EXCLUDED: ["t-neutral", "near", "Not covered by that recall", "Your label details rule it out."],
  };

  function hero(d, primary) {
    const key = d.status === "NO_MATCH" && primary?.kind === "EXCLUDED" ? "EXCLUDED" : d.status;
    const [tone, ic, title, sub0] = HERO[key] ?? HERO.NO_MATCH;
    let sub = sub0;
    if (key === "NEEDS_INFO") sub = primary?.missing?.[0] ?? sub0;
    if (key === "EXCLUDED") sub = primary?.evidence?.find((e) => e.polarity < 0)?.text ?? sub0;
    if (key === "CONFIRMED") sub = primary?.remedyOptions?.length ? `Official remedy: ${primary.remedyOptions.join(" or ").toLowerCase()}.` : sub0;
    return $("section", { class: "hero " + tone, "aria-live": "polite" }, $("div", { class: "badge" }, icon(ic)), $("div", {}, $("h1", {}, title), $("p", {}, sub)));
  }

  function criteriaTable(m) {
    if (!m.criteria?.length) return null;
    return $("div", { class: "crit", role: "table", "aria-label": "How the recall compares with your item" }, m.criteria.map((c, i) => {
      const yours = c.yours ? $("div", { class: "v yours" }, $("small", {}, "Yours"), c.yours) : $("div", { class: "v yours none" }, $("small", {}, "Yours"), c.state === "unknown" && c.key !== "product" ? "Not given yet" : "—");
      return $("div", { class: "row s-" + c.state, role: "row", style: `animation-delay:${0.05 * i}s` }, $("div", { class: "ic", "aria-label": c.state }, icon(STATE_ICON[c.state])), $("div", { class: "k" }, c.label), $("div", { class: "v" }, $("small", {}, "Recall"), c.recall), yours);
    }));
  }

  function photoStrip(list) {
    if (!list?.length) return null;
    return $("div", { class: "photos" }, list.map((p) => $("figure", {}, link(p.url, $("img", { src: p.url, alt: p.caption, loading: "lazy", referrerpolicy: "no-referrer" }), ""), $("figcaption", {}, p.caption))));
  }

  function fixCard(m) {
    const txt = $("div", { class: "txt clamp" }, m.remedy || "Follow the instructions on the recall notice.");
    const more = $("button", { class: "link", onclick: (e) => { txt.classList.toggle("clamp"); e.target.textContent = txt.classList.contains("clamp") ? "Show all steps" : "Show fewer"; } }, "Show all steps");
    return $("div", { class: "fix" }, $("p", { class: "eyebrow" }, "Official fix"), m.remedyOptions?.length ? $("div", { class: "chips" }, m.remedyOptions.map((o) => $("span", { class: "chip" }, o))) : null, txt, (m.remedy || "").length > 220 ? more : null, m.contact ? $("div", { class: "contact c2", title: m.contact }, "Contact: " + m.contact) : null);
  }

  /** Text clamped to a few lines with a toggle, so the key facts fit one Echo Show screen. */
  function clamped(text, cls, threshold) {
    const el = $("div", { class: cls }, text);
    if (text.length <= threshold) return el;
    const wrap = $("div", {}, el);
    const toggle = $("button", { class: "link", onclick: (e) => { const on = el.classList.toggle("c3"); e.currentTarget.textContent = on ? "Show more" : "Show less"; } }, "Show more");
    wrap.append(toggle);
    return wrap;
  }

  function metaRow(m) {
    return $("div", { class: "meta" }, $("span", { class: "pill" }, m.source + " " + m.number), $("span", {}, "Announced " + fmtDate(m.date)), m.units ? $("span", {}, m.units + " units") : null);
  }

  function compactMatch(m) {
    return $("div", { class: "mini" }, $("h2", { title: m.title }, m.name), metaRow(m), criteriaTable(m), m.missing?.length ? $("div", { class: "need" }, $("b", {}, "To be sure"), m.missing.map((t) => $("div", {}, t))) : null);
  }

  function renderCheck(d) {
    const primary = d.matches[0] ?? d.excluded[0];
    const left = $("div", { class: "col" }), right = $("div", { class: "col" });
    const grid = $("div", { class: "grid" }, left, right);

    left.append(hero(d, primary));

    if (d.label) {
      const l = d.label;
      const fields = [["Brand", l.brand], ["Model", l.model], ["Made", l.dateCode], ["Batch", l.batch], ["Serial", l.serial]];
      const found = fields.filter(([, v]) => v), absent = fields.filter(([, v]) => !v).map(([k]) => k);
      left.append($("div", { class: "read strip" }, $("span", { class: "eyebrow", style: "margin:0 4px 0 2px" }, "Read from label"), found.map(([k, v]) => $("span", { class: "pill" }, k + ": ", $("b", {}, v))), absent.length ? $("span", { class: "pill miss" }, "Not on label: " + absent.join(", ")) : null));
    }

    if (primary) {
      const card = $("div", { class: "card" }, $("p", { class: "eyebrow" }, primary.kind === "EXCLUDED" ? "The recall it resembles" : "Recall"), $("h2", { title: primary.title }, primary.name), metaRow(primary), criteriaTable(primary));
      if (primary.missing?.length && primary.kind !== "EXCLUDED") card.append($("div", { class: "need" }, $("b", {}, "To be sure"), primary.missing.map((t) => $("div", {}, t))));
      if (primary.kind === "EXCLUDED") card.append($("p", { class: "why" }, "Recall notices can be incomplete. If the label reads differently, tell me and I'll check again."));
      left.append(card);

      if (primary.kind === "CONFIRMED") {
        const actions = $("div", { class: "actions" }, link(primary.url, [icon("check"), "Open the official recall page"], "btn primary"));
        if (d.caseNickname) {
          const mark = (status, label) => $("button", { class: "btn", onclick: async (e) => { const b = e.currentTarget; b.disabled = true; try { const r = await callTool("update_case", { case: d.caseNickname, status }); render(r.structuredContent); } catch { b.textContent = label + " ✓"; } } }, label);
          actions.append(mark("stopped_using", "I've stopped using it"), mark("remedy_requested", "I requested the fix"));
        }
        left.append(actions);
      }

  }

  const FLOW = ["recalled", "stopped_using", "remedy_requested", "remedy_completed"];
  const FLOW_LABEL = { recalled: "Recall found", stopped_using: "Stopped using", remedy_requested: "Fix requested", remedy_completed: "Fix done" };

  function caseCard(c, standalone = true) {
    const idx = FLOW.indexOf(c.status);

    right.append($("div", { class: "card nextstep" }, $("p", { class: "eyebrow" }, "Next step"), $("div", { class: "big" }, c.nextStep)));
    if (c.notes?.length) right.append($("div", { class: "card" }, $("p", { class: "eyebrow" }, "Your notes"), $("ul", { class: "plain" }, c.notes.map((n) => $("li", {}, n.text)))));

    root.replaceChildren($("div", { class: "grid" }, left, right));

  function renderCases(list) {

    if (d.kind === "check") renderCheck(d);
    else if (d.kind === "case") renderCase(d.case);
    else if (d.kind === "cases") renderCases(d.cases);
    else if (d.kind === "recall") renderRecall(d);

  }
  window.__render = render; // lets a standalone page or test drive the view
})();
